services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_DB: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://agenda:${POSTGRES_PASSWORD}@db:5432/agenda
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET em .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENGINEER_NAME: ${ENGINEER_NAME:-}
      ENGINEER_PHONE: ${ENGINEER_PHONE:-}
      ENGINEER_PASSWORD: ${ENGINEER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
