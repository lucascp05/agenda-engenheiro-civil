services:
  api:
    environment:
      AGENDA_PUBLICACAO: "1"
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure SITE_DOMAIN}
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Configure API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
volumes:
  caddydata:
  caddyconfig:
